name: Validate Blog
on:
  pull_request:
    branches: [main]
    paths:
      - "content/blog/**"
      - "docs/posts/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "docs/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: mkdocs-material-

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install pyyaml markdown pytest

      - name: Sync blog posts
        run: python scripts/sync-blog.py

      - name: Generate category pages
        run: python scripts/generate-categories.py

      - name: Validate front matter & abstract length
        run: |
          python scripts/validate_blog_posts.py
          python scripts/validate-blog-posts.py

      - name: Run tests
        run: pytest -v

      - name: Build (strict) — validates index & post generation, sorting, slugs
        run: mkdocs build --strict
