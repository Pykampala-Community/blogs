# Deploy PyKampala Blog — builds from Markdown and publishes to GitHub Pages
name: ci
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache MkDocs
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -r requirements.txt 2>/dev/null || true
          pip install pyyaml markdown pytest

      - name: Sync blog posts (content/blog -> docs/posts)
        run: python scripts/sync-blog.py

      - name: Generate category pages
        run: python scripts/generate-categories.py

      - name: Validate blog posts
        run: |
          python scripts/validate_blog_posts.py
          python scripts/validate-blog-posts.py

      - name: Run tests
        run: pytest -v

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
